name: Import Pluto textures
on:
  push:
    paths:
      - ".github/workflows/import-pluto-textures.yml"

permissions:
  contents: write

jobs:
  import-textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and prepare NASA New Horizons maps
        run: |
          python -m pip install --quiet pillow numpy
          mkdir -p public/textures /tmp/pluto
          curl -L --fail --retry 3 "https://d2pn8kiwq2w21t.cloudfront.net/original_images/jpegPIA11707.jpg" -o /tmp/pluto/pluto.jpg
          curl -L --fail --retry 3 "https://d2pn8kiwq2w21t.cloudfront.net/original_images/jpegPIA19866.jpg" -o /tmp/pluto/charon.jpg
          python - <<'PY'
          from PIL import Image, ImageFilter
          import numpy as np

          def prepare(src, dst):
              im=Image.open(src).convert("RGB")
              a=np.array(im).astype(np.float32)
              h,w=a.shape[:2]
              lum=a.mean(axis=2)
              missing=lum<7

              # Keep every observed New Horizons pixel unchanged. The unobserved
              # southern cap is rendered as a deliberately neutral, detail-free
              # cap instead of inventing terrain or stretching edge pixels.
              observed=~missing
              ys,xs=np.where(observed)
              south_band=observed & (np.indices((h,w))[0] > int(h*.48))
              samples=a[south_band]
              if len(samples):
                  cap=np.median(samples,axis=0)
              else:
                  cap=np.array([78.,55.,48.])

              yy=np.linspace(0,1,h)[:,None]
              cap_img=np.zeros_like(a)
              cap_img[:]=cap
              # Gentle latitude shading gives the sphere a clean pole without
              # fake geological features.
              shade=(1.0-0.22*np.clip((yy-.55)/.45,0,1))[...,None]
              cap_img*=shade

              # Feather the boundary around missing data to avoid a hard seam.
              mask=Image.fromarray((missing*255).astype(np.uint8))
              mask=mask.filter(ImageFilter.GaussianBlur(radius=max(5,h//100)))
              alpha=np.asarray(mask,dtype=np.float32)[...,None]/255.0
              out=a*(1-alpha)+cap_img*alpha
              out=np.clip(out,0,255).astype(np.uint8)

              result=Image.fromarray(out).resize((2048,1024),Image.Resampling.LANCZOS)
              result.save(dst,"JPEG",quality=90,optimize=True,progressive=True)

          prepare("/tmp/pluto/pluto.jpg","public/textures/2k_pluto.jpg")
          prepare("/tmp/pluto/charon.jpg","public/textures/2k_charon.jpg")
          PY
      - name: Commit local textures
        run: |
          git config user.name "space-explorer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/textures/2k_pluto.jpg public/textures/2k_charon.jpg
          git commit -m "EXPLORA: add local NASA Pluto and Charon textures"
          git push origin main
